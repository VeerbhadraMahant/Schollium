repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (offline suite)
        entry: python -m pytest -q -m "not store and not live"
        language: system
        pass_filenames: false
        stages: [pre-commit]
