[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholium"
version = "0.0.1"
description = "A modular, local-first research assistant: seven command-line tools over one shared Postgres store."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Veerbhadra Mahant" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pgvector>=0.3",
    "rich>=13.7",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
pdf = ["pymupdf>=1.24"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "testcontainers[postgres]>=4.5",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[project.scripts]
scholium = "scholium.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scholium"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "store: needs a throwaway Postgres via testcontainers",
    "live: hits a real external service, excluded from the offline suite",
]
